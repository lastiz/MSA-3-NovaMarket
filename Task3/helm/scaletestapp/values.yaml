replicaCount: 1

image:
  repository: ghcr.io/yandex-practicum/scaletestapp
  tag: latest
  pullPolicy: IfNotPresent

containerPort: 8080

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    memory: "20Mi"
  limits:
    memory: "30Mi"

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 10
  targetMemoryUtilizationPercentage: 80
